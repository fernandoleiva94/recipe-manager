server.port=8081

spring.application.name=recipes-manager
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${URI_DB}
spring.datasource.username=${USER_DB}
spring.datasource.password=${PASSWORD_DB}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Agrupa los SELECT de entidades/colecciones LAZY en lotes (where id in (?,?,...))
# en vez de una consulta por cada entidad. Mitiga N+1 en relaciones recursivas
# (Recipe -> recipeRecipeRelations -> subRecipe -> ...) sin cambiar el mapeo.
spring.jpa.properties.hibernate.default_batch_fetch_size=25

recipe.manager.service.recipeFrontUrl=${FRONT_URL}
CLOUDINARY_URL=cloudinary://998839553627531:7Pz5bc8804Tg7lFCXl64b6ZqQy8@drm5bdjjk
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
